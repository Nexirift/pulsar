packages:
  - packages/misskey-js
  - packages/misskey-js/generator
  - packages/backend
  - packages/frontend-shared
  - packages/frontend
  - packages/frontend-embed
  - packages/sw
  - packages/megalodon
  - packages/misskey-reversi
  - packages/misskey-bubble-game

allowBuilds:
  '@nestjs/core': true
  '@parcel/watcher': true
  '@sentry-internal/node-cpu-profiler': true
  '@swc/core': true
  argon2: true
  bufferutil: true
  canvas: true
  cypress: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  re2: true
  sharp: true
  unrs-resolver: true
  utf-8-validate: true
  v-code-diff: true
  vue-demi: true

ignorePatchFailures: false

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@parcel/watcher"
  - "@sentry-internal/node-cpu-profiler"
  - "@sentry/profiling-node"
  - "@swc/core"
  - "@tensorflow/tfjs-node"
  - argon2
  - bufferutil
  - canvas
  - core-js
  - cypress
  - esbuild
  - msgpackr-extract
  - msw
  - nice-napi
  - re2
  - sharp
  - unrs-resolver
  - utf-8-validate
  - v-code-diff
  - vue-demi
