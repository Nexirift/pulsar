---
introMisskey: "Willkommen! Pulsar ist eine dezentralisierte Open-Source Microblogging-Platform.\nVerfasse „Notizen“ um mitzuteilen, was gerade passiert oder um Ereignisse mit anderen zu teilen. 📡\nMit „Reaktionen“ kannst du außerdem schnell deine Gefühle über Notizen anderer Benutzer zum Ausdruck bringen. 👍\nEine neue Welt wartet auf dich! 🚀"
poweredByMisskeyDescription: '{name} wird durch die Open-Source-Plattform <b>Pulsar</b> betrieben, die auf Misskey basiert (meist als "Misskey-Instanz" bezeichnet).'
flagAsBotDescription: "Aktiviere diese Option, falls dieses Benutzerkonto durch ein Programm gesteuert wird. Falls aktiviert, agiert es als Flag für andere Entwickler zur Verhinderung von endlosen Kettenreaktionen mit anderen Bots und lässt Pulsars interne Systeme dieses Benutzerkonto als Bot behandeln."
intro: "Pulsar ist installiert! Lass uns nun ein Administratorkonto einrichten."
aboutMisskey: "Über Pulsar"
useSoundOnlyWhenActive: "Gebe nur Ton aus, wenn Pulsar aktiv ist"
scratchpadDescription: "Die Testumgebung bietet einen Bereich für AiScript-Experimente. Dort kannst du AiScript schreiben, ausführen sowie dessen Auswirkungen auf Pulsar überprüfen."
sendErrorReportsDescription: "Ist diese Option aktiviert, so werden beim Auftreten von Fehlern detaillierte Fehlerinformationen an Pulsar weitergegeben, was zur Verbesserung der Qualität von Pulsar beiträgt.\nEnthalten in diesen Informationen sind u.a. die Version deines Betriebssystems, welchen Browser du verwendest und ein Verlauf deiner Aktivitäten innerhalb Pulsar."
misskeyUpdated: "Pulsar wurde aktualisiert!"
didYouLikeMisskey: "Gefällt dir Pulsar?"
pleaseDonate: "Pulsar ist die kostenlose Software, die von {host} verwendet wird. Wir würden uns über Spenden freuen, damit dessen Entwicklung weitergeführt werden kann!"
goToMisskey: "Zu Pulsar"
repositoryUrlDescription: "Wenn es ein Repository gibt, in dem der Quellcode öffentlich zugänglich ist, gib dessen URL ein. Wenn du Pulsar unverändert verwendest (ohne Änderungen am Quellcode), gib bitte https://git.codeguilds.org/Nexirift/pulsar ein."
