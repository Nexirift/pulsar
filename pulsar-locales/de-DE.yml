  _timeline:
    description1: "Pulsar verfügt über mehrere Chroniken (einige können je nach den Richtlinien des Servers nicht verfügbar sein)."
  _postNote:
    description1: "Wenn du eine Notiz auf Pulsar veröffentlichst, stehen dir verschiedene Optionen zur Verfügung. Die Oberfläche sieht folgendermaßen aus."
  _done:
